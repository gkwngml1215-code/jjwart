# 원장 컬럼 자동 점검
# main 브랜치에 무언가 올라올 때마다, 그리고 매일 아침 한 번 컬럼 목록이 온전한지 확인합니다.
# 실패하면 GitHub 가 저장소 주인에게 메일을 보냅니다. (Actions 탭에서 자세한 내용을 볼 수 있습니다)
name: 컬럼 목록 점검

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 직전 커밋과 비교해 글이 줄었는지 보기 위해
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 목록·페이지·사진·sitemap·llms 대조
        run: node .github/scripts/check-columns.js
